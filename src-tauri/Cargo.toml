[package]
name = "nexora"
version = "0.33.0"
description = "Notizen, LOP und Runbooks in einer schlanken Desktop-App"
edition = "2021"

[lib]
name = "nexora_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset", "image-png"] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# generate_context! braucht serde_json, sobald Plugin-Einstellungen in tauri.conf.json stehen
serde_json = "1"
serde = { version = "1", features = ["derive"] }
# Texterkennung über die Windows-OCR; dieselbe Version, die Tauri schon mitbringt
windows = { version = "0.62", features = ["Data_Pdf", "Foundation", "Foundation_Collections", "Graphics_Imaging", "Media_Ocr", "Storage", "Storage_Streams", "Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_WinRT", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "UI", "UI_Input_Inking"] }
# Word/Excel/PowerPoint lesen; dieselbe Version wie im Updater, nur Entpacken
zip = { version = "4.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# Team-Server: HTTP und Krypto wie beim Updater (prüft Zertifikate über den Windows-Speicher), PKCE
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"
url = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[dev-dependencies]
# nur für den Freihand-Test (IIterable aus einem Vec); kommt mit windows ohnehin mit
windows-collections = "0.3"
